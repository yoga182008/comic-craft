<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Complete — ComicCraft</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><main class="center-page"><div class="card success-card">

</div></main></body></html>
